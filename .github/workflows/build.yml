name: Build MRS

on:
  workflow_dispatch:

  schedule:
    # Каждые 6 часов
    - cron: "23 */6 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Download GeoDAT files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p input

          echo "Downloading geoip.dat..."
          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            -o input/geoip.dat \
            "https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release/geoip.dat"

          echo "Downloading geosite.dat..."
          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            -o input/geosite.dat \
            "https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release/geosite.dat"

          echo
          echo "Downloaded files:"
          ls -lh input/

      - name: Verify GeoDAT files
        shell: bash
        run: |
          set -euo pipefail

          test -s input/geoip.dat
          test -s input/geosite.dat

          echo "SHA256:"
          sha256sum input/geoip.dat
          sha256sum input/geosite.dat

      - name: Clone MetaCubeX converter
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/meta-rules-converter

          git clone \
            --depth=1 \
            https://github.com/MetaCubeX/meta-rules-converter.git \
            /tmp/meta-rules-converter

          echo
          echo "Converter repository:"
          ls -la /tmp/meta-rules-converter

      - name: Build MetaCubeX converter
        shell: bash
        run: |
          set -euo pipefail

          cd /tmp/meta-rules-converter

          echo "Go version:"
          go version

          echo
          echo "Building converter..."

          go build \
            -trimpath \
            -o "${GITHUB_WORKSPACE}/converter" \
            .

          chmod +x "${GITHUB_WORKSPACE}/converter"

          echo
          echo "Built converter:"
          ls -lh "${GITHUB_WORKSPACE}/converter"

          echo
          echo "Converter help:"
          "${GITHUB_WORKSPACE}/converter" --help || true

      - name: Convert all GeoSite categories
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist/geosite
          mkdir -p dist/geosite

          echo "Converting geosite.dat..."

          ./converter \
            geosite \
            -f input/geosite.dat \
            -o dist/geosite

          echo
          echo "GeoSite conversion finished."

      - name: Convert all GeoIP categories
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist/geoip
          mkdir -p dist/geoip

          echo "Converting geoip.dat..."

          ./converter \
            geoip \
            -f input/geoip.dat \
            -o dist/geoip

          echo
          echo "GeoIP conversion finished."

      - name: Validate generated MRS
        shell: bash
        run: |
          set -euo pipefail

          GEOSITE_COUNT="$(
            find dist/geosite \
              -type f \
              -name "*.mrs" \
              | wc -l
          )"

          GEOIP_COUNT="$(
            find dist/geoip \
              -type f \
              -name "*.mrs" \
              | wc -l
          )"

          echo "GeoSite MRS count: ${GEOSITE_COUNT}"
          echo "GeoIP MRS count:   ${GEOIP_COUNT}"

          if [ "${GEOSITE_COUNT}" -eq 0 ]; then
            echo "ERROR: No GeoSite MRS files generated"
            exit 1
          fi

          if [ "${GEOIP_COUNT}" -eq 0 ]; then
            echo "ERROR: No GeoIP MRS files generated"
            exit 1
          fi

      - name: Show generated categories
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "GeoSite categories"
          echo "======================================"

          find dist/geosite \
            -type f \
            -name "*.mrs" \
            -printf "%f\n" \
            | sort

          echo
          echo "======================================"
          echo "GeoIP categories"
          echo "======================================"

          find dist/geoip \
            -type f \
            -name "*.mrs" \
            -printf "%f\n" \
            | sort

      - name: Prepare release directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf publish

          mkdir -p publish/geosite
          mkdir -p publish/geoip

          cp -a dist/geosite/. publish/geosite/
          cp -a dist/geoip/. publish/geoip/

      - name: Generate categories lists
        shell: bash
        run: |
          set -euo pipefail

          find publish/geosite \
            -type f \
            -name "*.mrs" \
            -printf "%f\n" \
            | sort \
            > publish/geosite-categories.txt

          find publish/geoip \
            -type f \
            -name "*.mrs" \
            -printf "%f\n" \
            | sort \
            > publish/geoip-categories.txt

          {
            echo "# GeoSite categories"
            echo

            sed \
              's/^/- /' \
              publish/geosite-categories.txt

            echo
            echo "# GeoIP categories"
            echo

            sed \
              's/^/- /' \
              publish/geoip-categories.txt
          } > publish/categories.md

      - name: Generate hashes
        shell: bash
        run: |
          set -euo pipefail

          sha256sum input/geoip.dat \
            | awk '{print $1}' \
            > publish/geoip.dat.sha256

          sha256sum input/geosite.dat \
            | awk '{print $1}' \
            > publish/geosite.dat.sha256

      - name: Generate build info
        shell: bash
        run: |
          set -euo pipefail

          GEOSITE_COUNT="$(
            find publish/geosite \
              -type f \
              -name "*.mrs" \
              | wc -l
          )"

          GEOIP_COUNT="$(
            find publish/geoip \
              -type f \
              -name "*.mrs" \
              | wc -l
          )"

          {
            echo "Built at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "Source repository:"
            echo "https://github.com/runetfreedom/russia-v2ray-rules-dat"
            echo
            echo "Source GeoIP:"
            echo "https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release/geoip.dat"
            echo
            echo "Source GeoSite:"
            echo "https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release/geosite.dat"
            echo
            echo "Converter:"
            echo "https://github.com/MetaCubeX/meta-rules-converter"
            echo
            echo "GeoSite MRS count: ${GEOSITE_COUNT}"
            echo "GeoIP MRS count: ${GEOIP_COUNT}"
            echo
            echo "Source SHA256:"
            echo -n "geoip.dat: "
            cat publish/geoip.dat.sha256
            echo -n "geosite.dat: "
            cat publish/geosite.dat.sha256
          } > publish/build-info.txt

      - name: Show release contents
        shell: bash
        run: |
          set -euo pipefail

          echo "Release directory:"
          du -sh publish

          echo
          echo "Largest GeoSite files:"
          find publish/geosite \
            -type f \
            -name "*.mrs" \
            -printf "%s %p\n" \
            | sort -nr \
            | head -20 \
            | numfmt \
                --field=1 \
                --to=iec \
                --suffix=B \
            || true

          echo
          echo "Largest GeoIP files:"
          find publish/geoip \
            -type f \
            -name "*.mrs" \
            -printf "%s %p\n" \
            | sort -nr \
            | head -20 \
            | numfmt \
                --field=1 \
                --to=iec \
                --suffix=B \
            || true

      - name: Publish release branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          cd publish

          git init

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b release

          git add --all

          git commit \
            -m "Update MRS $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git push \
            --force \
            origin \
            release
