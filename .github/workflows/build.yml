name: Build MRS rule sets

on:
  workflow_dispatch:

  schedule:
    # Run at 00:00 and 12:00 in New York local time.
    # GitHub handles the EDT/EST transition automatically.
    - cron: "0 0,12 * * *"
      timezone: "America/New_York"

permissions:
  contents: write

concurrency:
  group: build-mrs-main
  cancel-in-progress: false

env:
  TZ: America/New_York
  SOURCE_REPOSITORY: https://github.com/runetfreedom/russia-v2ray-rules-dat.git
  CONVERTER_REPOSITORY: https://github.com/MetaCubeX/meta-rules-converter.git

jobs:
  build:
    name: Check, build and publish MRS
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          WORK_DIR="${RUNNER_TEMP}/mihomo-runet-mrs"

          rm -rf "${WORK_DIR}"
          mkdir -p \
            "${WORK_DIR}/input" \
            "${WORK_DIR}/output/geosite" \
            "${WORK_DIR}/output/geoip"

          echo "WORK_DIR=${WORK_DIR}" >> "${GITHUB_ENV}"

      - name: Check upstream state
        id: state
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_COMMIT="$(
            git ls-remote "${SOURCE_REPOSITORY}" refs/heads/release \
              | awk 'NR == 1 {print $1}'
          )"

          CONVERTER_COMMIT="$(
            git ls-remote "${CONVERTER_REPOSITORY}" HEAD \
              | awk 'NR == 1 {print $1}'
          )"

          if [ -z "${SOURCE_COMMIT}" ]; then
            echo "Error: unable to resolve the upstream release branch." >&2
            exit 1
          fi

          if [ -z "${CONVERTER_COMMIT}" ]; then
            echo "Error: unable to resolve the converter HEAD commit." >&2
            exit 1
          fi

          GEOIP_SUM_URL="https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/${SOURCE_COMMIT}/geoip.dat.sha256sum"
          GEOSITE_SUM_URL="https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/${SOURCE_COMMIT}/geosite.dat.sha256sum"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --output "${WORK_DIR}/geoip.dat.sha256sum" \
            "${GEOIP_SUM_URL}"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --output "${WORK_DIR}/geosite.dat.sha256sum" \
            "${GEOSITE_SUM_URL}"

          EXPECTED_GEOIP_HASH="$(
            awk 'NR == 1 {print $1}' "${WORK_DIR}/geoip.dat.sha256sum"
          )"

          EXPECTED_GEOSITE_HASH="$(
            awk 'NR == 1 {print $1}' "${WORK_DIR}/geosite.dat.sha256sum"
          )"

          if ! [[ "${EXPECTED_GEOIP_HASH}" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "Error: invalid upstream geoip.dat SHA-256 value." >&2
            exit 1
          fi

          if ! [[ "${EXPECTED_GEOSITE_HASH}" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "Error: invalid upstream geosite.dat SHA-256 value." >&2
            exit 1
          fi

          EXPECTED_GEOIP_HASH="${EXPECTED_GEOIP_HASH,,}"
          EXPECTED_GEOSITE_HASH="${EXPECTED_GEOSITE_HASH,,}"
          CONVERTER_COMMIT="${CONVERTER_COMMIT,,}"
          SOURCE_COMMIT="${SOURCE_COMMIT,,}"

          PREVIOUS_GEOIP_HASH=""
          PREVIOUS_GEOSITE_HASH=""
          PREVIOUS_CONVERTER_COMMIT=""

          if [ -f geoip.dat.sha256 ]; then
            PREVIOUS_GEOIP_HASH="$(
              tr -d '[:space:]' < geoip.dat.sha256 \
                | tr '[:upper:]' '[:lower:]'
            )"
          fi

          if [ -f geosite.dat.sha256 ]; then
            PREVIOUS_GEOSITE_HASH="$(
              tr -d '[:space:]' < geosite.dat.sha256 \
                | tr '[:upper:]' '[:lower:]'
            )"
          fi

          if [ -f converter.commit ]; then
            PREVIOUS_CONVERTER_COMMIT="$(
              tr -d '[:space:]' < converter.commit \
                | tr '[:upper:]' '[:lower:]'
            )"
          fi

          BUILD_REQUIRED=false
          REASONS=()

          if [ "${EXPECTED_GEOIP_HASH}" != "${PREVIOUS_GEOIP_HASH}" ]; then
            BUILD_REQUIRED=true
            REASONS+=("geoip.dat changed")
          fi

          if [ "${EXPECTED_GEOSITE_HASH}" != "${PREVIOUS_GEOSITE_HASH}" ]; then
            BUILD_REQUIRED=true
            REASONS+=("geosite.dat changed")
          fi

          if [ "${CONVERTER_COMMIT}" != "${PREVIOUS_CONVERTER_COMMIT}" ]; then
            BUILD_REQUIRED=true
            REASONS+=("meta-rules-converter changed")
          fi

          REQUIRED_PATHS=(
            "geosite"
            "geoip"
            "geosite-categories.txt"
            "geoip-categories.txt"
            "categories.md"
            "geoip.dat.sha256"
            "geosite.dat.sha256"
            "source.commit"
            "converter.commit"
            "mrs-manifest.sha256"
            "skipped-empty-rules.txt"
            "build-info.txt"
          )

          for path in "${REQUIRED_PATHS[@]}"; do
            if [ ! -e "${path}" ]; then
              BUILD_REQUIRED=true
              REASONS+=("missing generated path: ${path}")
            fi
          done

          if [ -f mrs-manifest.sha256 ]; then
            if ! sha256sum --check --quiet mrs-manifest.sha256; then
              BUILD_REQUIRED=true
              REASONS+=("generated MRS files failed integrity check")
            fi
          fi

          echo "Upstream snapshot:     ${SOURCE_COMMIT}"
          echo "geoip.dat SHA-256:     ${EXPECTED_GEOIP_HASH}"
          echo "geosite.dat SHA-256:   ${EXPECTED_GEOSITE_HASH}"
          echo "Converter commit:      ${CONVERTER_COMMIT}"

          if [ "${BUILD_REQUIRED}" = true ]; then
            echo
            echo "Rebuild required:"
            printf '  - %s\n' "${REASONS[@]}"
          else
            echo
            echo "No source, converter or local integrity changes detected."
          fi

          echo "source_commit=${SOURCE_COMMIT}" >> "${GITHUB_OUTPUT}"
          echo "geoip_hash=${EXPECTED_GEOIP_HASH}" >> "${GITHUB_OUTPUT}"
          echo "geosite_hash=${EXPECTED_GEOSITE_HASH}" >> "${GITHUB_OUTPUT}"
          echo "converter_commit=${CONVERTER_COMMIT}" >> "${GITHUB_OUTPUT}"
          echo "build_required=${BUILD_REQUIRED}" >> "${GITHUB_OUTPUT}"

      - name: Download source GeoDAT files
        if: steps.state.outputs.build_required == 'true'
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.state.outputs.source_commit }}
          EXPECTED_GEOIP_HASH: ${{ steps.state.outputs.geoip_hash }}
          EXPECTED_GEOSITE_HASH: ${{ steps.state.outputs.geosite_hash }}
        run: |
          set -euo pipefail

          GEOIP_URL="https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/${SOURCE_COMMIT}/geoip.dat"
          GEOSITE_URL="https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/${SOURCE_COMMIT}/geosite.dat"

          download() {
            local url="$1"
            local output="$2"

            curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --retry 5 \
              --retry-delay 5 \
              --retry-all-errors \
              --output "${output}" \
              "${url}"

            test -s "${output}"
          }

          download "${GEOIP_URL}" "${WORK_DIR}/input/geoip.dat"
          download "${GEOSITE_URL}" "${WORK_DIR}/input/geosite.dat"

          ACTUAL_GEOIP_HASH="$(
            sha256sum "${WORK_DIR}/input/geoip.dat" | awk '{print $1}'
          )"

          ACTUAL_GEOSITE_HASH="$(
            sha256sum "${WORK_DIR}/input/geosite.dat" | awk '{print $1}'
          )"

          if [ "${ACTUAL_GEOIP_HASH}" != "${EXPECTED_GEOIP_HASH}" ]; then
            echo "Error: geoip.dat checksum verification failed." >&2
            exit 1
          fi

          if [ "${ACTUAL_GEOSITE_HASH}" != "${EXPECTED_GEOSITE_HASH}" ]; then
            echo "Error: geosite.dat checksum verification failed." >&2
            exit 1
          fi

          printf '%s\n' "${ACTUAL_GEOIP_HASH}" \
            > "${WORK_DIR}/geoip.dat.sha256"

          printf '%s\n' "${ACTUAL_GEOSITE_HASH}" \
            > "${WORK_DIR}/geosite.dat.sha256"

          printf '%s\n' "${SOURCE_COMMIT}" \
            > "${WORK_DIR}/source.commit"

          echo "Downloaded and verified source files from ${SOURCE_COMMIT}:"
          ls -lh \
            "${WORK_DIR}/input/geoip.dat" \
            "${WORK_DIR}/input/geosite.dat"

      - name: Set up Go
        if: steps.state.outputs.build_required == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Fetch converter source
        if: steps.state.outputs.build_required == 'true'
        shell: bash
        env:
          CONVERTER_COMMIT: ${{ steps.state.outputs.converter_commit }}
        run: |
          set -euo pipefail

          CONVERTER_DIR="${WORK_DIR}/meta-rules-converter"

          git init -q "${CONVERTER_DIR}"
          git -C "${CONVERTER_DIR}" remote add origin "${CONVERTER_REPOSITORY}"
          git -C "${CONVERTER_DIR}" fetch \
            --quiet \
            --depth 1 \
            origin \
            "${CONVERTER_COMMIT}"
          git -C "${CONVERTER_DIR}" checkout \
            --quiet \
            --detach \
            FETCH_HEAD

          ACTUAL_COMMIT="$(
            git -C "${CONVERTER_DIR}" rev-parse HEAD
          )"

          if [ "${ACTUAL_COMMIT}" != "${CONVERTER_COMMIT}" ]; then
            echo "Error: fetched converter commit does not match the expected commit." >&2
            exit 1
          fi

          printf '%s\n' "${CONVERTER_COMMIT}" \
            > "${WORK_DIR}/converter.commit"

      - name: Build converter
        if: steps.state.outputs.build_required == 'true'
        shell: bash
        run: |
          set -euo pipefail

          (
            cd "${WORK_DIR}/meta-rules-converter"

            go build \
              -trimpath \
              -o "${WORK_DIR}/converter" \
              .
          )

          chmod +x "${WORK_DIR}/converter"

      - name: Convert GeoSite database
        if: steps.state.outputs.build_required == 'true'
        shell: bash
        run: |
          set -euo pipefail

          "${WORK_DIR}/converter" \
            geosite \
            -f "${WORK_DIR}/input/geosite.dat" \
            -o "${WORK_DIR}/output/geosite"

      - name: Convert GeoIP database
        if: steps.state.outputs.build_required == 'true'
        shell: bash
        run: |
          set -euo pipefail

          "${WORK_DIR}/converter" \
            geoip \
            -f "${WORK_DIR}/input/geoip.dat" \
            -o "${WORK_DIR}/output/geoip"

      - name: Validate conversion output
        if: steps.state.outputs.build_required == 'true'
        shell: bash
        run: |
          set -euo pipefail

          SKIPPED_FILE="${WORK_DIR}/skipped-empty-rules.txt"
          : > "${SKIPPED_FILE}"

          # Some attribute-only categories legitimately contain no rules.
          # The converter reports them as "empty rule" and leaves zero-byte
          # output files behind. They are not valid MRS files, so exclude them
          # from the published rule set instead of failing the entire build.
          find "${WORK_DIR}/output/geosite" \
            -type f \
            -name "*.mrs" \
            -size 0 \
            -printf 'geosite/%P\n' \
            >> "${SKIPPED_FILE}"

          find "${WORK_DIR}/output/geoip" \
            -type f \
            -name "*.mrs" \
            -size 0 \
            -printf 'geoip/%P\n' \
            >> "${SKIPPED_FILE}"

          LC_ALL=C sort -o "${SKIPPED_FILE}" "${SKIPPED_FILE}"

          SKIPPED_COUNT="$(
            grep -c . "${SKIPPED_FILE}" || true
          )"

          if [ "${SKIPPED_COUNT}" -gt 0 ]; then
            echo "Skipping ${SKIPPED_COUNT} empty rule set(s):"
            sed 's/^/  - /' "${SKIPPED_FILE}"

            find "${WORK_DIR}/output/geosite" \
              -type f \
              -name "*.mrs" \
              -size 0 \
              -delete

            find "${WORK_DIR}/output/geoip" \
              -type f \
              -name "*.mrs" \
              -size 0 \
              -delete
          fi

          GEOSITE_COUNT="$(
            find "${WORK_DIR}/output/geosite" \
              -type f \
              -name "*.mrs" \
              | wc -l
          )"

          GEOIP_COUNT="$(
            find "${WORK_DIR}/output/geoip" \
              -type f \
              -name "*.mrs" \
              | wc -l
          )"

          if [ "${GEOSITE_COUNT}" -eq 0 ]; then
            echo "Error: GeoSite conversion produced no usable .mrs files." >&2
            exit 1
          fi

          if [ "${GEOIP_COUNT}" -eq 0 ]; then
            echo "Error: GeoIP conversion produced no usable .mrs files." >&2
            exit 1
          fi

          echo
          echo "Usable GeoSite MRS files: ${GEOSITE_COUNT}"
          echo "Usable GeoIP MRS files:   ${GEOIP_COUNT}"
          echo "Skipped empty rule sets:  ${SKIPPED_COUNT}"

      - name: Sync with latest main branch
        if: steps.state.outputs.build_required == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git rebase origin/main

      - name: Replace generated rule sets
        if: steps.state.outputs.build_required == 'true'
        shell: bash
        run: |
          set -euo pipefail

          # Only generated data is replaced. Hand-maintained repository files
          # such as README.md, LICENSE and workflow files are left untouched.
          rm -rf geosite geoip
          mkdir -p geosite geoip

          cp -a "${WORK_DIR}/output/geosite/." geosite/
          cp -a "${WORK_DIR}/output/geoip/." geoip/

          cp "${WORK_DIR}/geoip.dat.sha256" geoip.dat.sha256
          cp "${WORK_DIR}/geosite.dat.sha256" geosite.dat.sha256
          cp "${WORK_DIR}/source.commit" source.commit
          cp "${WORK_DIR}/converter.commit" converter.commit
          cp "${WORK_DIR}/skipped-empty-rules.txt" skipped-empty-rules.txt

      - name: Generate indexes and manifest
        if: steps.state.outputs.build_required == 'true'
        shell: bash
        run: |
          set -euo pipefail

          find geosite \
            -type f \
            -name "*.mrs" \
            -printf "%f\n" \
            | LC_ALL=C sort \
            > geosite-categories.txt

          find geoip \
            -type f \
            -name "*.mrs" \
            -printf "%f\n" \
            | LC_ALL=C sort \
            > geoip-categories.txt

          {
            echo "# Available rule sets"
            echo
            echo "Generated automatically from the current conversion output."
            echo
            echo "## GeoSite"
            echo
            sed 's/^/- `/' geosite-categories.txt | sed 's/$/`/'
            echo
            echo "## GeoIP"
            echo
            sed 's/^/- `/' geoip-categories.txt | sed 's/$/`/'
          } > categories.md

          find geosite geoip \
            -type f \
            -name "*.mrs" \
            -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum \
            > mrs-manifest.sha256

          test -s mrs-manifest.sha256
          sha256sum --check --quiet mrs-manifest.sha256

      - name: Generate build metadata
        if: steps.state.outputs.build_required == 'true'
        shell: bash
        run: |
          set -euo pipefail

          GEOSITE_COUNT="$(
            find geosite \
              -type f \
              -name "*.mrs" \
              | wc -l
          )"

          GEOIP_COUNT="$(
            find geoip \
              -type f \
              -name "*.mrs" \
              | wc -l
          )"

          SKIPPED_COUNT="$(
            grep -c . skipped-empty-rules.txt || true
          )"

          BUILD_TIME="$(date '+%Y-%m-%d %H:%M:%S %Z')"

          {
            echo "Built at: ${BUILD_TIME}"
            echo "Timezone: America/New_York"
            echo
            echo "Source repository:"
            echo "https://github.com/runetfreedom/russia-v2ray-rules-dat"
            echo
            echo "Source snapshot:"
            cat source.commit
            echo
            echo "Converter repository:"
            echo "https://github.com/MetaCubeX/meta-rules-converter"
            echo
            echo "Converter commit:"
            cat converter.commit
            echo
            echo "GeoSite MRS files: ${GEOSITE_COUNT}"
            echo "GeoIP MRS files:   ${GEOIP_COUNT}"
            echo "Skipped empty MRS: ${SKIPPED_COUNT}"
            echo
            echo -n "geoip.dat SHA256:   "
            cat geoip.dat.sha256
            echo -n "geosite.dat SHA256: "
            cat geosite.dat.sha256
          } > build-info.txt

      - name: Commit generated files
        if: steps.state.outputs.build_required == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- \
            geosite \
            geoip \
            geosite-categories.txt \
            geoip-categories.txt \
            categories.md \
            geoip.dat.sha256 \
            geosite.dat.sha256 \
            source.commit \
            converter.commit \
            mrs-manifest.sha256 \
            skipped-empty-rules.txt \
            build-info.txt

          if git diff --cached --quiet; then
            echo "Rebuild completed, but the generated repository content is unchanged."
            exit 0
          fi

          BUILD_TIME="$(date '+%Y-%m-%d %H:%M:%S %Z')"

          git commit -m "Update MRS rule sets (${BUILD_TIME})"

          # Pick up unrelated commits that may have landed while the build was
          # running. A real conflict fails safely instead of being force-pushed.
          git pull --rebase origin main

          git push origin HEAD:main

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "## MRS build"
            echo
            echo "Job status: ${{ job.status }}"
            echo

            if [ "${{ steps.state.outcome }}" != "success" ]; then
              echo "The upstream state check did not complete successfully."
            elif [ "${{ steps.state.outputs.build_required }}" = "true" ]; then
              echo "A rebuild was required for this run."
            else
              echo "No rebuild was required. The existing generated files are current."
            fi

            echo
            echo "Checked at: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          } >> "${GITHUB_STEP_SUMMARY}"
