name: Build MRS

on:
  workflow_dispatch:

  schedule:
    # Каждые 6 часов
    - cron: "23 */6 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Download GeoDAT files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p input

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            -o input/geoip.dat \
            "https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release/geoip.dat"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            -o input/geosite.dat \
            "https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release/geosite.dat"

          echo "Downloaded files:"
          ls -lh input/

      - name: Verify GeoDAT files
        shell: bash
        run: |
          set -euo pipefail

          test -s input/geoip.dat
          test -s input/geosite.dat

          sha256sum input/geoip.dat
          sha256sum input/geosite.dat

      - name: Build MetaCubeX converter
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            https://github.com/MetaCubeX/meta-rules-converter.git \
            /tmp/meta-rules-converter

          cd /tmp/meta-rules-converter

          go build \
            -trimpath \
            -o "${GITHUB_WORKSPACE}/converter" \
            .

          "${GITHUB_WORKSPACE}/converter" --help || true

      - name: Convert all GeoSite categories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist/geosite

          ./converter \
            geosite \
            -f input/geosite.dat \
            -o dist/geosite

      - name: Convert all GeoIP categories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist/geoip

          ./converter \
            geoip \
            -f input/geoip.dat \
            -o dist/geoip

      - name: Show result
        shell: bash
        run: |
          set -euo pipefail

          echo "============================"
          echo "GeoSite MRS:"
          echo "============================"

          find dist/geosite \
            -type f \
            -name "*.mrs" \
            -printf "%f\n" \
            | sort

          echo
          echo "============================"
          echo "GeoIP MRS:"
          echo "============================"

          find dist/geoip \
            -type f \
            -name "*.mrs" \
            -printf "%f\n" \
            | sort

          echo
          echo "============================"

          GEOSITE_COUNT="$(
            find dist/geosite -type f -name "*.mrs" | wc -l
          )"

          GEOIP_COUNT="$(
            find dist/geoip -type f -name "*.mrs" | wc -l
          )"

          echo "GeoSite categories: ${GEOSITE_COUNT}"
          echo "GeoIP categories:   ${GEOIP_COUNT}"

          test "${GEOSITE_COUNT}" -gt 0
          test "${GEOIP_COUNT}" -gt 0

      - name: Prepare release
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p publish/geosite
          mkdir -p publish/geoip

          cp -a dist/geosite/. publish/geosite/
          cp -a dist/geoip/. publish/geoip/

          sha256sum input/geoip.dat \
            | awk '{print $1}' \
            > publish/geoip.dat.sha256

          sha256sum input/geosite.dat \
            | awk '{print $1}' \
            > publish/geosite.dat.sha256

          {
            echo "Built at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "Source:"
            echo "runetfreedom/russia-v2ray-rules-dat"
            echo
            echo "GeoIP:"
            echo "https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release/geoip.dat"
            echo
            echo "GeoSite:"
            echo "https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release/geosite.dat"
            echo
            echo "Converter:"
            echo "MetaCubeX/meta-rules-converter"
            echo
            echo "GeoSite MRS count:"
            find publish/geosite -type f -name "*.mrs" | wc -l
            echo
            echo "GeoIP MRS count:"
            find publish/geoip -type f -name "*.mrs" | wc -l
          } > publish/build-info.txt

      - name: Publish release branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          cd publish

          git init

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b release

          git add .

          git commit \
            -m "Update MRS $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git push \
            --force \
            origin \
            release
